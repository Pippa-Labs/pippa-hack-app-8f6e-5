# ─────────────────────────────────────────────────────────────────────────────
# Nearest Sunshine's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about the app is generated from this file, and
# the runtime refuses anything not declared here. Layout, rules and comments
# follow Pippa's public template (Pippa-Labs/pippa-hack-space-photo).
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Every hackathon app runs with `persistence: none`: it keeps nothing between
# calls. Do not change it.
persistence: none

# ── Public author name ───────────────────────────────────────────────────────
#
# A PLACEHOLDER pseudonym, chosen so the app and its tests could be built
# without asking. It is public: shown as "by <name>" on the install screen, in
# the list of apps and on every answer. Replace it with the builder's own
# pseudonym before the first push (never a real name or an email address),
# and set `git config user.name` to the same value. 3 to 30 characters;
# letters, numbers, spaces, dots, hyphens and underscores; not "pippa",
# "official" or "verified".
app_author_name: "Sunny Spells"

app:
  # `hack.` + the repository name without `pippa-hack-`, hyphens as
  # underscores: Pippa-Labs/pippa-hack-app-8f6e-5 -> hack.app_8f6e_5.
  id: hack.app_8f6e_5
  name: Nearest Sunshine
  # Three numbers. Bump it after a version has been submitted for review.
  version: 0.1.0
  # Never the word "by" here: the badge is parsed from
  # "[via <name> <version> by <author name>]" and splits on the first "by".
  summary: >-
    Finds the nearest sunny towns for a day trip from London, with distance,
    train time, sunshine and temperature. Checks a named town too, and sends
    only fixed town coordinates to the free Open-Meteo weather service, never
    your words.
agent_types:
  - personal

# ── Outcomes ─────────────────────────────────────────────────────────────────
#
# One job. Example phrases are written the way people type, with carrier
# words ("nearest sunshine", "where is it sunny") rather than one subject, and
# they avoid words other apps own: "today", "tomorrow", "this week",
# "my calendar" and "what's on" belong to Pippa's diary, and a phrase using
# them loses.

outcomes:
  - id: sunshine.find
    summary: >-
      Find the nearest towns with sunshine in the next few hours for a day
      trip, or check whether a named town will get sun
    example_phrases:
      - where's the nearest sunshine
      - is it going to be sunny in
      - nearest sunny town for a day trip
      - where can i find some sun
      - where is it sunny near
      - is it sunny at the seaside this afternoon
      - which towns nearby are sunny right now
      - how far do i have to go for sunshine
      - sunny day trip from
    inputs:
      - name: start
        type: string
        required: false
        description: >-
          Where the person is starting from, exactly as they wrote it, for
          example "London", "Clapham" or "Reading" ("where's the nearest
          sunshine to Reading" -> "Reading"). Only a place they said they are
          in or leaving from. If the message names no starting point, return
          an empty string: the app then starts from London. Never guess one.
      - name: place
        type: string
        required: false
        description: >-
          One particular town they asked about, exactly as they wrote it, for
          example "Brighton" in "will it be sunny in Brighton this afternoon".
          Only a place whose weather they asked about, not where they start
          from. If they asked generally where the sun is, return an empty
          string. Never guess one.
      - name: when
        type: string
        required: false
        description: >-
          The part of the day they asked about, in their words, for example
          "this afternoon", "this morning", "this evening", "now",
          "tomorrow" or "tomorrow morning". If the message says no time,
          return an empty string: the app then looks at the next few hours.
    output:
      - name: start
        type: string
        description: Where the distances and travel times are measured from, for example "London".
      - name: window
        type: string
        description: >-
          The daylight hours looked at, in words and UK clock times, for
          example "this afternoon (12:00–16:02)". Empty when there is no
          live weather.
      - name: places
        type: array
        item_type: string
        description: >-
          Up to three nearest towns with sunshine, nearest first, each as
          "Town: distance, travel time, hours of sun (best hours), top
          temperature". Empty when none is sunny or there is no live weather.
      - name: sunny_places_found
        type: integer
        description: How many of the towns checked should get sunshine in the window.
      - name: live_weather
        type: boolean
        description: >-
          False when the Open-Meteo forecast could not be fetched, in which
          case nothing else here is a forecast.
      - name: nearest_place
        type: string
        required: false
        description: The nearest town with sunshine. Absent when there is none.
      - name: nearest_distance_km
        type: number
        required: false
        description: Straight-line distance from the start to the nearest sunny town, in km.
      - name: nearest_travel_minutes
        type: integer
        required: false
        description: >-
          Minutes to get there: the typical fastest train from a London
          terminal when starting in London, otherwise a rough road estimate.
      - name: nearest_sunny_hours
        type: number
        required: false
        description: Hours of sunshine forecast there in the window.
      - name: nearest_temperature_c
        type: number
        required: false
        description: Highest temperature forecast there in the window, °C.
      - name: asked_place
        type: string
        required: false
        description: The town they asked about by name, if any.
      - name: asked_place_sunny
        type: boolean
        required: false
        description: Whether that town should get sunshine in the window.
      - name: asked_place_forecast
        type: string
        required: false
        description: That town's sunshine and top temperature in the window, in words.

# ── API keys ─────────────────────────────────────────────────────────────────
#
# None. Open-Meteo is free and needs no key, so there is no `app_secrets:`
# block and nothing to set under Keys in Pippa. No `connectors:` and no
# `secrets:` either: hackathon apps may not ask for a user's credentials.
